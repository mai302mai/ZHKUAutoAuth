name: Linux release builds

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            zig_target: x86_64-linux-musl
            processor: x86_64
            expected_arch: x86_64
          - name: i386
            zig_target: x86-linux-musl
            processor: i386
            expected_arch: i386
          - name: aarch64
            zig_target: aarch64-linux-musl
            processor: aarch64
            expected_arch: aarch64
          - name: armhf
            zig_target: arm-linux-musleabihf
            processor: arm
            expected_arch: arm

    steps:
      - name: Check out source and pinned dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build llvm

      - name: Install Zig
        shell: bash
        run: |
          set -euo pipefail
          zig_version=0.14.1
          archive="zig-x86_64-linux-${zig_version}.tar.xz"
          archive_url="https://ziglang.org/download/${zig_version}/${archive}"
          expected_sha256=24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c
          curl --fail --location --retry 3 "$archive_url" --output "$RUNNER_TEMP/$archive"
          echo "$expected_sha256  $RUNNER_TEMP/$archive" | sha256sum --check
          mkdir --parents "$RUNNER_TEMP/zig"
          tar --extract --file "$RUNNER_TEMP/$archive" \
            --directory "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          echo "ZIG_EXECUTABLE=$RUNNER_TEMP/zig/zig" >> "$GITHUB_ENV"

      - name: Configure cross-compilation
        run: >
          cmake -S . -B "build/${{ matrix.name }}" -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64-linux-musl.cmake
          -DCMAKE_C_COMPILER_TARGET=${{ matrix.zig_target }}
          -DAUTOAUTH_TARGET_PROCESSOR=${{ matrix.processor }}
          -DCMAKE_BUILD_TYPE=Release
          -DAUTOAUTH_ENABLE_TLS=OFF
          -DAUTOAUTH_ENABLE_LINUX_INTERFACE_BINDING=ON

      - name: Build
        run: cmake --build "build/${{ matrix.name }}" --parallel 2 --target AutoAuth

      - name: Verify executable architecture
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
          TARGET_NAME: ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          binary="build/${TARGET_NAME}/AutoAuth"
          file "$binary"
          llvm-readobj --file-headers "$binary" > "$RUNNER_TEMP/elf-header.txt"
          grep -F "Arch: ${EXPECTED_ARCH}" "$RUNNER_TEMP/elf-header.txt"
          grep -F "Type: Executable" "$RUNNER_TEMP/elf-header.txt"
          if [[ "$TARGET_NAME" == armhf ]]; then
            llvm-readobj --arch-specific "$binary" > "$RUNNER_TEMP/arm-attributes.txt"
            grep -F "Description: AAPCS VFP" "$RUNNER_TEMP/arm-attributes.txt"
          fi
          if llvm-readobj --program-headers "$binary" | grep -q 'PT_INTERP'; then
            echo "Expected a statically linked executable without PT_INTERP." >&2
            exit 1
          fi

      - name: Package release archive
        env:
          TARGET_NAME: ${{ matrix.name }}
        run: |
          mkdir --parents "dist/${TARGET_NAME}/licenses"
          cp "build/${TARGET_NAME}/AutoAuth" "dist/${TARGET_NAME}/AutoAuth"
          cp LICENSE README.md "dist/${TARGET_NAME}/"
          cp third_party/curl/COPYING "dist/${TARGET_NAME}/licenses/curl-COPYING"
          cp third_party/cJSON/LICENSE "dist/${TARGET_NAME}/licenses/cJSON-LICENSE"
          tar --create --gzip \
            --file "dist/AutoAuth-linux-${TARGET_NAME}.tar.gz" \
            --directory "dist/${TARGET_NAME}" .
          sha256sum "dist/AutoAuth-linux-${TARGET_NAME}.tar.gz" \
            > "dist/AutoAuth-linux-${TARGET_NAME}.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoAuth-linux-${{ matrix.name }}
          path: |
            dist/AutoAuth-linux-${{ matrix.name }}.tar.gz
            dist/AutoAuth-linux-${{ matrix.name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AutoAuth-linux-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          body: |
            This release adds automated GitHub Actions builds for four static Linux architectures: amd64, i386, AArch64, and ARM hard-float (armhf).

            Each archive contains the AutoAuth executable and the project, curl, and cJSON license notices. SHA-256 checksums are provided alongside the archives.
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
